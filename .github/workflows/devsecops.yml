# DevSecOps pipeline for the VitaClin appointments API (06-devsecops).
# Every third-party action is pinned to a full commit SHA: tags can be
# force-pushed, as happened to aquasecurity/trivy-action in CVE-2026-33634.
name: DevSecOps pipeline

on:
  push:
    branches: [main]
    paths: ["06-devsecops/**", ".github/workflows/devsecops.yml"]
  pull_request:
    paths: ["06-devsecops/**", ".github/workflows/devsecops.yml"]
  workflow_dispatch:

# Least privilege by default; jobs ask only for what they need
permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: 06-devsecops/app
  IMAGE: ghcr.io/${{ github.repository_owner }}/vitaclin-appointments-api
  TRIVY_VERSION: v0.69.3

jobs:
  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install semgrep==1.182.1
      - name: Semgrep (Python, Dockerfile and workflow rules)
        run: >
          semgrep scan --error --metrics=off
          --config p/python --config p/dockerfile --config p/github-actions
          "$APP_DIR" .github/workflows

  dependencies:
    name: Dependency audit and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt pip-audit==2.10.1
      - name: Known vulnerabilities in Python dependencies (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Unit and security tests
        run: python -m pytest -q

  build:
    name: Build and scan image (Trivy)
    needs: [secrets, sast, dependencies]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t vitaclin-api:scan "$APP_DIR"
      - name: Dockerfile misconfiguration scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: ${{ env.APP_DIR }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Image vulnerability scan (fails on fixable HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: vitaclin-api:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: vitaclin-api:scan
          format: cyclonedx
          output: sbom.cdx.json
      # The exact image that was scanned is the one that gets published
      - run: docker save vitaclin-api:scan -o image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-and-sbom
          path: |
            image.tar
            sbom.cdx.json
          retention-days: 7

  publish:
    name: Publish, sign and attest (Cosign keyless)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC token for keyless signing, no long-lived keys
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-and-sbom
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        run: |
          docker load -i image.tar
          docker tag vitaclin-api:scan "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"
          echo "DIGEST_REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Sign image and attach SBOM attestation (by digest)
        run: |
          cosign sign --yes "$DIGEST_REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$DIGEST_REF"
      - name: Verify signature
        run: >
          cosign verify "$DIGEST_REF"
          --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/devsecops.yml@"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
